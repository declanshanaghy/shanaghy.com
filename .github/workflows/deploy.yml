name: build & deploy the garden

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install pillow for image optimization
        run: pip install Pillow
      - name: optimize images (png -> webp, max-dim 512, q80)
        run: python3 web/scripts/optimize_images.py
      - name: build the forge
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: github pages custom 404
        run: cp web/out/404/index.html web/out/404.html
      - name: nojekyll
        run: touch web/out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4