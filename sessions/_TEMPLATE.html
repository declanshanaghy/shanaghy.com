<!--
  ============================================================
  _TEMPLATE.html — session page template (shanaghy.com/sessions)

  PUBLISHING CONVENTION:
    1. Copy this file to sessions/<your-session-slug>.html
       (slug = lowercase, hyphenated, e.g. ballad-of-many-Mossys.html)
    2. Fill in the TITLE and CONTENT placeholders below.
       (Do NOT publish the template itself.)
    3. Add a matching card to sessions/index.html
       (title, date, blurb, link to ./<your-session-slug>.html).
    4. Commit and push — GitHub Pages does the rest.

  Aesthetic: dark moss-green terminal (bg #0b0f0c, green #62d483,
  amber #e2b93b, monospace, minimal). Keep it consistent.
  ============================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- TITLE: replace with the session's real title -->
<title>SESSION TITLE · shanaghy.com</title>
<style>

@font-face{font-family:'Noto Sans Ogham';src:url('../assets/fonts/NotoSansOgham-Regular.ttf') format('truetype');font-display:swap;}
.rt-rune,.rune,.ph-rune,.ph-grove,.pla-roundel,.pla-rune,.lh-rune{font-family:'Noto Sans Ogham',var(--mono,monospace);}
  :root {
    --bg: #0b0f0c;
    --fg: #a8c5ad;
    --green: #62d483;
    --amber: #e2b93b;
    --dim: #4a6b50;
    --border: #1e2b21;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "SF Mono", "Fira Code", Menlo, Consolas, monospace;
    font-size: 15px;
    line-height: 1.65;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
  .prompt { color: var(--green); }
  .prompt::before { content: "$ "; color: var(--dim); }
  h1 { margin: 0.5rem 0 0; font-size: 1.35rem; color: var(--green); font-weight: 600; }
  .meta { color: var(--amber); font-size: 0.8rem; margin-top: 0.4rem; }
  .back { display: inline-block; margin-top: 1.5rem; font-size: 0.8rem; color: var(--dim); }
  .back a { color: var(--green); }
  .back a::before { content: "← "; }
  a { color: var(--green); text-decoration: none; }
  a:hover { text-decoration: underline; }
  hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
  /* transcript styling — reuse if the session is a conversation log */
  .speaker { color: var(--green); font-weight: 600; }
  .speaker.user { color: var(--amber); }
  p { margin: 0 0 1rem; }
  footer { margin-top: 3rem; color: var(--dim); font-size: 0.8rem; border-top: 1px solid var(--border); padding-top: 1rem; }
</style>
</head>
<body>
<div class="wrap">
  <span class="back"><a href="./index.html">sessions index</a></span>

  <header>
    <div class="prompt">cat ./sessions/&lt;slug&gt;.md</div>
    <!-- TITLE: visible heading -->
    <h1>SESSION TITLE</h1>
    <div class="meta">YYYY-MM-DD · maybe a location / participants tag</div>
  </header>

  <hr>

  <!-- CONTENT: the body of the session goes here.
       For transcripts, a common pattern:

       <p><span class="speaker user">user:</span> ...</p>
       <p><span class="speaker">agent:</span> ...</p>
  -->
  <main>
    <p>Content goes here.</p>
  </main>

  <footer>
    // shanaghy.com/sessions — drop file in sessions/, add a card to
    // sessions/index.html, commit, push.
  </footer>
</div>
</body>
</html>
