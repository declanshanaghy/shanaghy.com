<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320">
  <title>Bog at Full Moon — top-level page restyle palette (issue #73)</title>
  <!-- page bg -->
  <rect width="800" height="320" fill="#040a07"/>

  <!-- topbar beam -->
  <rect x="0" y="20" width="800" height="52" fill="url(#beam)"/>
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#163024" stop-opacity=".55"/>
      <stop offset="26%"  stop-color="#0a1811" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#060d09" stop-opacity=".94"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="20" x2="800" y2="20" stroke="#63e0a0" stroke-opacity=".16" stroke-width="1"/>
  <!-- moss fringe dots -->
  <circle cx="13"  cy="72" r="3.2" fill="#1c3f2c" opacity=".85"/>
  <circle cx="22"  cy="72" r="2.4" fill="#122a1e" opacity=".85"/>
  <circle cx="32"  cy="72" r="3.2" fill="#1c3f2c" opacity=".85"/>
  <circle cx="41"  cy="72" r="2.4" fill="#122a1e" opacity=".85"/>
  <circle cx="51"  cy="72" r="3.2" fill="#1c3f2c" opacity=".85"/>
  <circle cx="60"  cy="72" r="2.4" fill="#122a1e" opacity=".85"/>
  <circle cx="70"  cy="72" r="3.2" fill="#1c3f2c" opacity=".85"/>
  <circle cx="79"  cy="72" r="2.4" fill="#122a1e" opacity=".85"/>

  <!-- brand pill -->
  <rect x="20" y="28" width="120" height="36" rx="12" ry="5"
        fill="none" stroke="#63e0a0" stroke-opacity=".2" stroke-width="1"
        fill-opacity="0"/>
  <rect x="20" y="28" width="120" height="36" rx="12" ry="5"
        fill="url(#brandpill)"/>
  <defs>
    <linearGradient id="brandpill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c3f2c" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#060d09" stop-opacity=".6"/>
    </linearGradient>
  </defs>
  <text x="84" y="51" font-family="monospace" font-size="9" letter-spacing="2" fill="#a9e6c3" text-anchor="middle" text-transform="uppercase">SHANAGHY</text>

  <!-- tlink pills -->
  <rect x="560" y="31" width="62" height="30" rx="10" ry="4" fill="none" stroke="transparent" stroke-width="1"/>
  <text x="591" y="51" font-family="monospace" font-size="7.5" letter-spacing="2" fill="#7f9c88" text-anchor="middle">CREED</text>
  <rect x="634" y="31" width="62" height="30" rx="10" ry="4" fill="rgba(99,224,160,.09)" stroke="#a9e6c3" stroke-opacity=".42" stroke-width="1"/>
  <text x="665" y="51" font-family="monospace" font-size="7.5" letter-spacing="2" fill="#e6f2e8" text-anchor="middle">GARDEN</text>
  <rect x="708" y="31" width="62" height="30" rx="10" ry="4" fill="none" stroke="transparent" stroke-width="1"/>
  <text x="739" y="51" font-family="monospace" font-size="7.5" letter-spacing="2" fill="#7f9c88" text-anchor="middle">PATHS</text>

  <!-- stone cards -->
  <rect x="20"  y="92" width="175" height="190" rx="24" fill="url(#stone1)" stroke="#1c3f2c" stroke-width="1"/>
  <rect x="210" y="92" width="175" height="190" rx="24" fill="url(#stone2)" stroke="#1c3f2c" stroke-width="1"/>
  <rect x="400" y="92" width="175" height="190" rx="24" fill="url(#stone3)" stroke="#1c3f2c" stroke-width="1"/>
  <rect x="590" y="92" width="175" height="190" rx="24" fill="url(#stone4)" stroke="#1c3f2c" stroke-width="1"/>
  <defs>
    <linearGradient id="stone1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d1f17"/>
      <stop offset="62%"  stop-color="#091410"/>
      <stop offset="100%" stop-color="#040a07"/>
    </linearGradient>
    <linearGradient id="stone2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d1f17"/>
      <stop offset="62%"  stop-color="#091410"/>
      <stop offset="100%" stop-color="#040a07"/>
    </linearGradient>
    <linearGradient id="stone3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d1f17"/>
      <stop offset="62%"  stop-color="#091410"/>
      <stop offset="100%" stop-color="#040a07"/>
    </linearGradient>
    <linearGradient id="stone4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d1f17"/>
      <stop offset="62%"  stop-color="#091410"/>
      <stop offset="100%" stop-color="#040a07"/>
    </linearGradient>
  </defs>
  <!-- moss cap tops on stones (biolume shimmer) -->
  <rect x="20"  y="92" width="175" height="22" rx="10" fill="url(#cap1)" opacity=".9"/>
  <rect x="210" y="92" width="175" height="22" rx="10" fill="url(#cap2)" opacity=".9"/>
  <rect x="400" y="92" width="175" height="22" rx="10" fill="url(#cap3)" opacity=".9"/>
  <rect x="590" y="92" width="175" height="22" rx="10" fill="url(#cap4)" opacity=".9"/>
  <defs>
    <radialGradient id="cap1" cx="20%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#2d5a42"/>
      <stop offset="60%" stop-color="#1f4835" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#040a07" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cap2" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#4f8468"/>
      <stop offset="60%" stop-color="#3d6b52" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#040a07" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cap3" cx="80%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#2d5a42"/>
      <stop offset="60%" stop-color="#1f4835" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#040a07" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cap4" cx="30%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#5e9478"/>
      <stop offset="60%" stop-color="#3d6b52" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#040a07" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- stone card labels -->
  <text x="107" y="165" font-family="Georgia,serif" font-size="13" fill="#f3faf1" text-anchor="middle" font-variant="small-caps" letter-spacing="1">Creed</text>
  <text x="107" y="185" font-family="monospace" font-size="9"  fill="#a7c3b3" text-anchor="middle">the oath</text>
  <text x="297" y="165" font-family="Georgia,serif" font-size="13" fill="#f3faf1" text-anchor="middle" font-variant="small-caps" letter-spacing="1">Garden</text>
  <text x="297" y="185" font-family="monospace" font-size="9"  fill="#a7c3b3" text-anchor="middle">the work</text>
  <text x="487" y="165" font-family="Georgia,serif" font-size="13" fill="#f3faf1" text-anchor="middle" font-variant="small-caps" letter-spacing="1">Paths</text>
  <text x="487" y="185" font-family="monospace" font-size="9"  fill="#a7c3b3" text-anchor="middle">the trail</text>
  <text x="677" y="165" font-family="Georgia,serif" font-size="13" fill="#f3faf1" text-anchor="middle" font-variant="small-caps" letter-spacing="1">Sessions</text>
  <text x="677" y="185" font-family="monospace" font-size="9"  fill="#a7c3b3" text-anchor="middle">the log</text>

  <!-- caption -->
  <text x="400" y="308" font-family="monospace" font-size="9" letter-spacing="2" fill="#4f8468" text-anchor="middle">BOG AT FULL MOON — ISSUE #73 — TOP-LEVEL PAGE RESTYLE</text>
</svg>
