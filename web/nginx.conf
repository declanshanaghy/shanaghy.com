# the garden's serving rules — bytes in, bytes out, TLS at the edge (the
# gateway terminates it; this box only answers)
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    # canonical URLs carry the trailing slash, as the export and Pages both do
    absolute_redirect off;
    error_page 404 /404.html;

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
