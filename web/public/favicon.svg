<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- dark ground — the soil of the garden -->
  <rect width="32" height="32" rx="5" fill="#050507"/>
  <!-- tree of life canopy — three overlapping circles form the Celtic crown -->
  <circle cx="16" cy="8"  r="5"   fill="#00d992"/>
  <circle cx="10" cy="13" r="4.5" fill="#00d992"/>
  <circle cx="22" cy="13" r="4.5" fill="#00d992"/>
  <!-- fill the hollow between the canopy lobes -->
  <ellipse cx="16" cy="12" rx="7.5" ry="5" fill="#00d992"/>
  <!-- trunk -->
  <rect x="14" y="17" width="4" height="7" rx="1.5" fill="#00d992"/>
  <!-- roots — spreading left and right from the base -->
  <line x1="14" y1="23" x2="9"  y2="27" stroke="#00d992" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="18" y1="23" x2="23" y2="27" stroke="#00d992" stroke-width="2.5" stroke-linecap="round"/>
</svg>
