# the garden's door inside the cluster — the gateway routes to it
apiVersion: v1
kind: Service
metadata:
  name: shanaghy-garden
  namespace: shanaghy-garden
  labels:
    app.kubernetes.io/name: shanaghy-garden
    app.kubernetes.io/component: site
    app.kubernetes.io/part-of: shanaghy.com
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shanaghy-garden
  ports:
    - name: http
      port: 80
      targetPort: http
