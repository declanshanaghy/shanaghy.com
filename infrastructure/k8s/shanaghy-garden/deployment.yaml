# the garden on GKE — the static export served by nginx, rolled by CI on
# every merge to main (see .github/workflows/deploy-gke.yml)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shanaghy-garden
  namespace: shanaghy-garden
  labels:
    app.kubernetes.io/name: shanaghy-garden
    app.kubernetes.io/component: site
    app.kubernetes.io/part-of: shanaghy.com
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: shanaghy-garden
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shanaghy-garden
        app.kubernetes.io/component: site
        app.kubernetes.io/part-of: shanaghy.com
    spec:
      containers:
        - name: garden
          # CI stamps the digest tag of the merge commit on every roll;
          # this value is the last known standing garden
          image: us-central1-docker.pkg.dev/fenrir-ledger-prod/shanaghy-images/shanaghy-garden:pending-first-build
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
