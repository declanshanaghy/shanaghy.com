# the routes: the garden answers on https, http only sends travelers there
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shanaghy-garden
  namespace: shanaghy-garden
  labels:
    app.kubernetes.io/name: shanaghy-garden
    app.kubernetes.io/part-of: shanaghy.com
spec:
  hostnames:
    - gke.shanaghy.com
  parentRefs:
    - name: shanaghy-garden
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: shanaghy-garden
          port: 80
          weight: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shanaghy-garden-redirect
  namespace: shanaghy-garden
  labels:
    app.kubernetes.io/name: shanaghy-garden
    app.kubernetes.io/part-of: shanaghy.com
spec:
  hostnames:
    - gke.shanaghy.com
  parentRefs:
    - name: shanaghy-garden
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
