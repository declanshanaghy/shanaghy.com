kind: FrontendConfig
metadata:
  name: shanaghy-garden-frontend
  namespace: shanaghy-garden
  labels:
    app.kubernetes.io/name: shanaghy-garden
    app.kubernetes.io/part-of: shanaghy.com
spec:
  redirectToHttps:
    responseCodeName: MOVED_PERMANENTLY_DEFAULT
